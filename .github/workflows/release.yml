name: Release

# CONVENTIONS.md § 14, on a tag vX.Y.Z, which `uv run bump-my-version bump
# minor` (or patch, or major) makes and `git push --follow-tags` pushes:
#   1. CI on the tagged commit;
#   2. the sdist and the wheel built and checked: the tag is v + the wheel's
#      version, the changelog has its section, the wheel installs and runs;
#   3. PyPI, by trusted publishing;
#   4. the GitHub release, its notes the changelog's section;
#   5. the image, built from the released wheel, tested, then pushed.
# Run by hand on an existing tag (Run workflow, then the tag), it builds and
# checks everything again, and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A release is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI on the tag
    # ./…, GitHub's documented form, which actionlint checks; zizmor suggests $/…, which it does not take.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The pipeline, released by the same tag: its lint and its tests on the
  # tagged commit (pipeline.yml).
  pipeline:
    name: The pipeline on the tag
    uses: ./.github/workflows/pipeline.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  build:
    name: Build and verify
    needs: [ci, pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: The sdist and the wheel
        run: uv build

      - name: Their metadata
        run: uvx twine==7.0.0 check --strict dist/*

      # The wheel's METADATA holds the version wherever the repository writes it.
      - name: The tag is v, then the wheel's version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(unzip -p dist/*.whl '*.dist-info/METADATA' | sed -n 's/^Version: //p')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG is not v$version, the version of the wheel"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Appendix B.2 of the migration plan: the `## [X.Y.Z]` heading, then
      # everything up to the next `## ` heading or a `---` line.
      - name: The changelog's section for it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## [" ver "]") == 1) found = 1; next }
            found && /^---$/ { exit }
            found
          ' docs/changelog.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md ||
            { echo "::error::docs/changelog.md has no entry for $VERSION"; exit 1; }

      # Packagers run the tests from the sdist (CONVENTIONS.md § 2).
      - name: The sdist ships the test data
        run: tar -tzf dist/*.tar.gz | grep -q '/tests/data/'

      - name: The wheel, installed in a clean environment, runs
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/plexembler" --version
          "$RUNNER_TEMP/smoke/bin/plexembler" --help

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            release-notes.md

  # PyPI comes later (docs/plan.md, Decisions): the job runs once the
  # repository variable PUBLISH_PYPI is true, after PyPI's trusted publisher is
  # set up, so that a release does not fail before.
  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/plexembler/${{ needs.build.outputs.version }}/
    permissions:
      # Trusted publishing, no stored token: js2264/plexembler is a
      # trusted publisher of plexembler on PyPI, for this workflow,
      # release.yml, and the environment pypi. It stays in each repository:
      # PyPI does not accept a reusable workflow as the publisher.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # After PyPI's job, whether it published or was skipped (PUBLISH_PYPI).
  github-release:
    name: The GitHub release
    needs: [build, publish]
    if: >-
      github.event_name == 'push' && !cancelled() && needs.build.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.publish.result)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist

      - name: vX.Y.Z, with the changelog's section, the sdist and the wheel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md --verify-tag

  # CONVENTIONS.md § 15: the image of the wheel just published, tested before
  # it is pushed; tags X.Y.Z and latest.
  image:
    name: The image
    needs: [build, publish]
    # The pipeline's own steps run in it (docs/plan.md, T1): it is published
    # whether or not PyPI is.
    if: >-
      github.event_name == 'push' && !cancelled() && needs.build.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.publish.result)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dist

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Built from the released wheel
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: plexembler:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image runs plexembler
        run: docker run --rm plexembler:test plexembler --version

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/plexembler
          # No `latest` from the action: the tags below say which image gets it.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pushed, for linux/amd64 and linux/arm64
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
