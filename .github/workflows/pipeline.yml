name: Pipeline

# The Nextflow pipeline, as ci.yml tests the package (CONVENTIONS.md § 6):
# `nextflow lint` and nf-core's lint, the parameters page and the version
# checked against their sources, then nf-test with Docker on the oldest
# Nextflow the pipeline supports (manifest.nextflowVersion) and the newest;
# and the pipeline run by pixi's script (docs/run.py). On pushes to main,
# every pull request, by hand, every week, and from release.yml on a tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Weekly: the newest Nextflow and nf-core's tools move between our changes.
    - cron: "41 5 * * 1"

permissions:
  contents: read

# As ci.yml: a newer push cancels the run it supersedes, never a tag's.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NXF_ANSI_LOG: false
  # nf-core/tools, as .nf-core.yml names it.
  NF_CORE_TOOLS: "4.2.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@c66f1bfa2dc817ae23f4b34eaa26fa5f1453ca71 # v3.1.0
        with:
          version: latest-everything

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: nextflow lint
        run: nextflow lint .

      # The version is written twice (pyproject.toml, nextflow.config's
      # manifest), and bump-my-version changes both: they must agree.
      - name: The pipeline's version is the package's
        run: |
          package=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          pipeline=$(sed -n "s/^    version         = '\(.*\)'$/\1/p" nextflow.config)
          if [ -z "$package" ] || [ "$package" != "$pipeline" ]; then
            echo "::error::nextflow.config's manifest.version ($pipeline) is not pyproject.toml's version ($package)"
            exit 1
          fi

      - name: nf-core lint
        run: uvx --from "nf-core==$NF_CORE_TOOLS" nf-core pipelines lint --dir .

      - name: docs/parameters.md is nextflow_schema.json's
        run: |
          uvx --from "nf-core==$NF_CORE_TOOLS" nf-core pipelines schema docs nextflow_schema.json --output docs/parameters.md --force
          git diff --exit-code docs/parameters.md ||
            { echo "::error::docs/parameters.md is out of date: run nf-core pipelines schema docs nextflow_schema.json --output docs/parameters.md --force"; exit 1; }

  nf-test:
    name: nf-test, Nextflow ${{ matrix.nextflow }}, shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # The shard that holds tests/default.nf.test runs the whole pipeline on
    # the test profile, on the runner's two CPUs.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # The oldest Nextflow manifest.nextflowVersion allows, and the newest.
        nextflow: ["26.04.0", "latest-everything"]
        # The tests in four shards: each pulls the images of its own steps
        # alone, which the runner's disk holds.
        shard: [1, 2, 3, 4]
    steps:
      # The tests' images take more room than the runner has free: the
      # toolchains of other languages go first.
      - name: Room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune --all --force
          df -h /

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@c66f1bfa2dc817ae23f4b34eaa26fa5f1453ca71 # v3.1.0
        with:
          version: ${{ matrix.nextflow }}

      - uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2.1.0
        with:
          version: "0.9.5"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # The pipeline's own steps run in ghcr.io/js2264/plexembler:<its version>
      # (docs/plan.md, T1): built here from the checkout, so that a pull request
      # tests its own code rather than the last release's.
      - name: The package's image, from the checkout
        run: |
          version=$(sed -n "s/^    version         = '\(.*\)'$/\1/p" nextflow.config)
          uv build --wheel
          docker build -t "ghcr.io/js2264/plexembler:$version" .
          docker run --rm "ghcr.io/js2264/plexembler:$version" plexembler --version

      # Every test: the pipeline's (tests/default.nf.test) and the local
      # subworkflows' and modules'; nf-core's own are ignored (nf-test.config).
      - name: nf-test, with Docker
        env:
          SHARD: ${{ matrix.shard }}
        run: nf-test test --ci --verbose --profile +docker --shard "$SHARD/4"

  # The pipeline as pixi runs it from its script (docs/run.py,
  # docs/installation.md): plexembler, with Nextflow from bioconda and Java
  # from conda-forge, in an environment pixi makes, on a runner with none of
  # them set up. The script takes the release from PyPI: here, the checkout's
  # plexembler stands for it. `plexembler run` hands over to that Nextflow,
  # which runs the checkout's pipeline on the test profile in preview: the
  # workflow and its samplesheets, without its tasks' containers.
  pixi:
    name: plexembler run, through pixi's script, pixi ${{ matrix.pixi }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest pixi the docs name (docs/installation.md): the first to
        # take a script's conda-pypi-map. And the newest.
        pixi: ["v0.80.0", "latest"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pixi alone: the repository has no pixi workspace to install.
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ matrix.pixi }}
          run-install: false
          cache: false

      - name: The script, with the checkout's plexembler for PyPI's
        run: |
          sed "s|\"plexembler==[^\"]*\"|\"plexembler @ file://$GITHUB_WORKSPACE\"|" docs/run.py > "$RUNNER_TEMP/run.py"
          grep -q "plexembler @ file://" "$RUNNER_TEMP/run.py" ||
            { echo "::error::docs/run.py names no plexembler==<version>"; exit 1; }

      - name: plexembler run, with nothing but pixi
        run: pixi run --script "$RUNNER_TEMP/run.py" -- --pipeline . -profile test -preview --outdir results
