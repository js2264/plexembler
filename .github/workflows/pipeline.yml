name: Pipeline

# The Nextflow pipeline, as ci.yml tests the package (CONVENTIONS.md § 6):
# `nextflow lint` and nf-core's lint, the parameters page and the version
# checked against their sources, then nf-test with Docker on the oldest
# Nextflow the pipeline supports (manifest.nextflowVersion) and the newest;
# the pipeline run as uvx runs it (docs/installation.md); and, weekly or by
# hand, the test profile in conda's environments, without a container engine.
# On pushes to main, every pull request, by hand, every week, and from
# release.yml on a tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Weekly: the newest Nextflow and nf-core's tools move between our changes.
    - cron: "41 5 * * 1"

permissions:
  contents: read

# As ci.yml: a newer push cancels the run it supersedes, never a tag's.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NXF_ANSI_LOG: false
  # nf-core/tools, as .nf-core.yml names it.
  NF_CORE_TOOLS: "4.2.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@c66f1bfa2dc817ae23f4b34eaa26fa5f1453ca71 # v3.1.0
        with:
          version: latest-everything

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: nextflow lint
        run: nextflow lint .

      # The version is written again in nextflow.config's manifest and in the
      # conda environments of the steps that run plexembler, and
      # bump-my-version changes them all: they must agree.
      - name: The pipeline's version is the package's
        run: |
          package=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          pipeline=$(sed -n "s/^    version         = '\(.*\)'$/\1/p" nextflow.config)
          if [ -z "$package" ] || [ "$package" != "$pipeline" ]; then
            echo "::error::nextflow.config's manifest.version ($pipeline) is not pyproject.toml's version ($package)"
            exit 1
          fi
          stale=$(grep -L "plexembler@v$package\"" modules/local/plexembler/*/environment.yml || true)
          if [ -n "$stale" ]; then
            echo "::error::conda environments that do not install plexembler at v$package: $stale"
            exit 1
          fi

      - name: nf-core lint
        run: uvx --from "nf-core==$NF_CORE_TOOLS" nf-core pipelines lint --dir .

      - name: docs/parameters.md is nextflow_schema.json's
        run: |
          uvx --from "nf-core==$NF_CORE_TOOLS" nf-core pipelines schema docs nextflow_schema.json --output docs/parameters.md --force
          git diff --exit-code docs/parameters.md ||
            { echo "::error::docs/parameters.md is out of date: run nf-core pipelines schema docs nextflow_schema.json --output docs/parameters.md --force"; exit 1; }

  nf-test:
    name: nf-test, Nextflow ${{ matrix.nextflow }}, shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # The shard that holds tests/default.nf.test runs the whole pipeline on
    # the test profile, on the runner's two CPUs.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # The oldest Nextflow manifest.nextflowVersion allows, and the newest.
        nextflow: ["26.04.0", "latest-everything"]
        # The tests in four shards: each pulls the images of its own steps
        # alone, which the runner's disk holds.
        shard: [1, 2, 3, 4]
    steps:
      # The tests' images take more room than the runner has free: the
      # toolchains of other languages go first.
      - name: Room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune --all --force
          df -h /

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@c66f1bfa2dc817ae23f4b34eaa26fa5f1453ca71 # v3.1.0
        with:
          version: ${{ matrix.nextflow }}

      - uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2.1.0
        with:
          version: "0.9.5"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # The pipeline's own steps run in ghcr.io/js2264/plexembler:<its version>
      # (docs/plan.md, T1): built here from the checkout, so that a pull request
      # tests its own code rather than the last release's.
      - name: The package's image, from the checkout
        run: |
          version=$(sed -n "s/^    version         = '\(.*\)'$/\1/p" nextflow.config)
          uv build --wheel
          docker build -t "ghcr.io/js2264/plexembler:$version" .
          docker run --rm "ghcr.io/js2264/plexembler:$version" plexembler --version

      # Every test: the pipeline's (tests/default.nf.test) and the local
      # subworkflows' and modules'; nf-core's own are ignored (nf-test.config).
      - name: nf-test, with Docker
        env:
          SHARD: ${{ matrix.shard }}
        run: nf-test test --ci --verbose --profile +docker --shard "$SHARD/4"

  # The pipeline as uv runs it (docs/installation.md): plexembler, with PyPI's
  # nextflow, Nextflow's launcher, on a runner with Java alone, the oldest and
  # the newest long-term Java that Nextflow takes. The launcher fetches
  # Nextflow at its first run; `plexembler run` hands over to it, and it runs
  # the checkout's pipeline on the test profile in preview: the workflow and
  # its samplesheets, without its tasks' containers. The checkout stands for
  # the release that uvx takes from PyPI.
  uv:
    name: plexembler run, through uvx, Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "25"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: plexembler run, with nothing but uv and Java
        run: uvx --from . plexembler run --pipeline . -profile test -preview --outdir results

  # The pipeline without a container engine (docs/usage.md): the test profile,
  # every step for real, in conda's environments, which micromamba makes, run
  # by uvx's plexembler on Java alone. Weekly and by hand: the environments
  # take a while to make. The steps that run plexembler install the
  # checkout's, for the release their environment.yml names.
  conda:
    name: The test profile, with micromamba
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # The environments take more room than the runner has free.
      - name: Room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # micromamba, at the version of the image's base (Dockerfile).
      - name: micromamba
        run: |
          mkdir -p "$RUNNER_TEMP/micromamba"
          curl -fsSL https://micro.mamba.pm/api/micromamba/linux-64/2.10.0 | tar -xj -C "$RUNNER_TEMP/micromamba" bin/micromamba
          echo "$RUNNER_TEMP/micromamba/bin" >> "$GITHUB_PATH"

      # split's environment holds every other's, and samtools.
      - name: The checkout's plexembler, for the steps that run it
        run: |
          sed "s|plexembler @ git+https://github.com/js2264/plexembler@v[0-9.]*|plexembler @ file://$GITHUB_WORKSPACE|" \
            modules/local/plexembler/split/environment.yml > "$RUNNER_TEMP/plexembler.yml"
          grep -q "plexembler @ file://" "$RUNNER_TEMP/plexembler.yml" ||
            { echo "::error::split's environment.yml installs no plexembler from its tag"; exit 1; }
          printf "process {\n    withName: 'PLEXEMBLER_.*' {\n        conda = '%s'\n    }\n}\n" "$RUNNER_TEMP/plexembler.yml" > "$RUNNER_TEMP/conda.config"

      - name: The test profile, with micromamba, run by uvx's plexembler
        run: uvx --from . plexembler run --pipeline . -profile test,micromamba -c "$RUNNER_TEMP/conda.config" --outdir results
