name: Benchmarks

# The milestones' "Done when" (docs/plan.md), checked on the benchmark pool's
# three sets, easy, medium and hard (benchmarks/README.md): the pipeline runs
# on each with Docker, a job per set, then benchmarks/evaluate.py checks its
# results against the set's truth. Every set and every milestone for every
# release tag; by hand, one set or all, one milestone or all. The easy and
# medium sets must pass; the hard set's tables are reported, its failures not
# the run's. A run takes hours: pull requests have nf-test (pipeline.yml).
#
# Each set is deterministic: it is fetched from the release
# `benchmark-data-v<GENERATOR_VERSION of benchmarks/make_benchmark_data.py>`
# (`<set>.tar`) when it holds it, and otherwise generated here, then
# published there with each file's checksum (`<set>.sha256`; on a release run,
# or when `publish-data` is set), so later runs check the very same reads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      set:
        description: "The set the pipeline runs on, or all"
        type: choice
        options: ["all", "easy", "medium", "hard"]
        default: "all"
      milestone:
        description: "The milestone whose checks run, or all"
        type: choice
        options: ["all", "1", "2", "3", "4", "5"]
        default: "all"
      publish-data:
        description: "Publish the sets generated by this run to their data release"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NXF_ANSI_LOG: false
  DATA: benchmarks/data

jobs:
  sets:
    name: The sets
    runs-on: ubuntu-latest
    outputs:
      sets: ${{ steps.pick.outputs.sets }}
    steps:
      # A release tag's run has no inputs: every set.
      - id: pick
        env:
          SET: ${{ inputs.set }}
        run: |
          if [ -z "$SET" ] || [ "$SET" = "all" ]; then
            echo 'sets=["easy","medium","hard"]' >> "$GITHUB_OUTPUT"
          else
            echo "sets=[\"$SET\"]" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    name: The ${{ matrix.set }} set, milestones ${{ inputs.milestone || 'all' }}
    needs: sets
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write # publish the data release
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(needs.sets.outputs.sets) }}
    env:
      GH_TOKEN: ${{ github.token }}
      SET: ${{ matrix.set }}
      # A release tag's run has no inputs: every milestone.
      MILESTONES: ${{ (!inputs.milestone || inputs.milestone == 'all') && '1 2 3 4 5' || inputs.milestone }}
    steps:
      # The annotation's images (BRAKER3's, RepeatModeler's) and the set's reads
      # need the room the runner's other toolchains take (as pipeline.yml).
      - name: Room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune --all --force
          df -h /

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@c66f1bfa2dc817ae23f4b34eaa26fa5f1453ca71 # v3.1.0
        with:
          version: latest-everything

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # No cache: this workflow publishes a release (zizmor's cache-poisoning).
          enable-cache: false

      - uses: mamba-org/setup-micromamba@b09ef9b599704322748535812ca03efb2625677b # v2.0.5
        with:
          environment-name: bench
          create-args: >-
            -c conda-forge -c bioconda
            python=3.12 badread=0.4.1 insilicoseq=2.0.1 busco=6.1.0 quast=5.3.0 minimap2=2.30
          cache-environment: false

      - name: Fetch the set, or generate it
        id: data
        shell: micromamba-shell {0}
        run: |
          version=$(sed -n 's/^GENERATOR_VERSION = \([0-9]*\).*/\1/p' benchmarks/make_benchmark_data.py)
          tag="benchmark-data-v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p "$DATA"
          if gh release download "$tag" --pattern "$SET.tar" --dir "$RUNNER_TEMP" --clobber 2>/dev/null; then
            tar -xf "$RUNNER_TEMP/$SET.tar" -C "$DATA"
            echo "made=false" >> "$GITHUB_OUTPUT"
          else
            python benchmarks/make_benchmark_data.py --outdir "$DATA" --threads 4 --level "$SET"
            echo "made=true" >> "$GITHUB_OUTPUT"
          fi
          du -sh "$DATA/$SET"
          # Each file's checksum, to compare a set with the release's.
          (cd "$DATA" && find "$SET" -type f | LC_ALL=C sort | xargs sha256sum) > "$RUNNER_TEMP/$SET.sha256"
          cat "$RUNNER_TEMP/$SET.sha256"

      - name: Publish the set
        if: steps.data.outputs.made == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish-data)
        env:
          TAG: ${{ steps.data.outputs.tag }}
        run: |
          tar -cf "$RUNNER_TEMP/$SET.tar" -C "$DATA" "$SET"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            {
              echo "The benchmark pool's three sets (benchmarks/README.md), made by"
              echo "\`benchmarks/make_benchmark_data.py\` (generator v${TAG##*-v}) at $GITHUB_SHA:"
              echo "three yeasts' nanopore reads, and their pool's WGS, Hi-C and RNA-seq, simulated,"
              echo "from the easiest set to the hardest."
              echo
              echo "\`tar -xf <set>.tar && sha256sum -c <set>.sha256\` unpacks a set and checks each file."
            } > "$RUNNER_TEMP/notes.md"
            # The three jobs race to make it: one that finds it made goes on.
            gh release create "$TAG" --title "Benchmark data (generator v${TAG##*-v})" \
              --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" --latest=false --prerelease ||
              gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/$SET.tar" "$RUNNER_TEMP/$SET.sha256" --clobber

      # The pipeline's own steps run in ghcr.io/js2264/plexembler:<its version>,
      # built here from the checkout (as pipeline.yml does).
      - name: The package's image, from the checkout
        run: |
          version=$(sed -n "s/^    version         = '\(.*\)'$/\1/p" nextflow.config)
          uv build --wheel
          docker build -t "ghcr.io/js2264/plexembler:$version" .

      - name: BUSCO's lineage
        shell: micromamba-shell {0}
        run: busco --download saccharomycetes_odb12 --download_path busco_downloads

      - name: The pipeline, on the set
        run: |
          nextflow run . -profile "benchmark_$SET,docker" --outdir results \
            --busco_db "$PWD/busco_downloads"

      # Milestone 2 compares polishing with the Hi-C reads, cut at their
      # junctions, to polishing with the WGS pairs: a second run, resumed.
      - name: The pipeline, polished with Hi-C
        if: contains(env.MILESTONES, '2')
        run: |
          nextflow run . -profile "benchmark_$SET,docker" --outdir results-hic \
            --busco_db "$PWD/busco_downloads" --polish_reads hic -resume

      - name: The checks
        shell: micromamba-shell {0}
        run: |
          failed=0
          for milestone in $MILESTONES; do
            hic=""
            [ "$milestone" = "2" ] && hic="--hic-results results-hic"
            # Milestone 3 scores planted misjoins with the package's own
            # `plexembler junctions`, from the checkout.
            python benchmarks/evaluate.py --results results --data "$DATA/$SET" \
              --milestone "$milestone" --busco-db busco_downloads \
              --plexembler "uv run --locked plexembler" $hic || failed=1
            report="results/benchmark/m$milestone.md"
            [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
          # The hard set measures how far the pipeline gets: reported, not gating.
          if [ "$SET" = "hard" ] && [ "$failed" = 1 ]; then
            echo "::warning::the hard set fails some checks (see the summary)"
            failed=0
          fi
          exit "$failed"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: benchmark-${{ matrix.set }}-${{ inputs.milestone || 'all' }}
          path: |
            results/benchmark/
            results/multiqc/
            results/pipeline_info/
          if-no-files-found: ignore
