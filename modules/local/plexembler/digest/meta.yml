name: "plexembler_digest"
description: Cuts a species' Hi-C reads at their ligation junctions, into single reads to polish with
keywords:
  - hi-c
  - pool
  - plexembler
tools:
  - "plexembler":
      description: "The commands of plexembler's pipeline"
      homepage: "https://github.com/js2264/plexembler"
      documentation: "https://js2264.github.io/plexembler/cli/#digest"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: The species' meta map; meta.enzymes its library's enzymes
    - reads:
        type: file
        description: The species' Hi-C reads
        pattern: "*.fastq.gz"
output:
  reads:
    - - meta:
          type: map
          description: The species' meta map
      - "*.digested.fastq.gz":
          type: file
          description: The pieces, as single reads
          pattern: "*.digested.fastq.gz"
  json:
    - - meta:
          type: map
          description: The species' meta map
      - "*.digest.json":
          type: file
          description: The reads by their junctions, and the pieces
          pattern: "*.digest.json"
  multiqc:
    - - meta:
          type: map
          description: The species' meta map
      - "*.digest_mqc.tsv":
          type: file
          description: The digestion, for MultiQC
          pattern: "*.digest_mqc.tsv"
  log:
    - - meta:
          type: map
          description: The species' meta map
      - "*.log":
          type: file
          description: The command's log
          pattern: "*.log"
  versions_plexembler:
    - - ${task.process}:
          type: string
          description: The process
      - plexembler:
          type: string
          description: The tool
      - "plexembler --version | sed 's/.* //'":
          type: eval
          description: Its version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process
      - plexembler:
          type: string
          description: The tool
      - "plexembler --version | sed 's/.* //'":
          type: eval
          description: Its version
authors:
  - "@js2264"
maintainers:
  - "@js2264"
