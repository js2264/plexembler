# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "plexembler_expression"
description: Writes a species' counts and TPM, genes by libraries, from featureCounts' table
keywords:
  - rna-seq
  - expression
  - tpm
tools:
  - "plexembler":
      description: "The companion package of js2264/plexembler"
      homepage: "https://js2264.github.io/plexembler/"
      documentation: "https://js2264.github.io/plexembler/cli/#expression"
      tool_dev_url: "https://github.com/js2264/plexembler"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: The species' meta map; meta.labels, each library's LIBRARY=LABEL
    - counts:
        type: file
        description: featureCounts' table, a column per library's BAM
        pattern: "*.featureCounts.tsv"
output:
  counts:
    - - meta:
          type: map
          description: The species' meta map
      - ${meta.id}.counts.tsv:
          type: file
          description: The counts, genes by libraries
          pattern: "*.counts.tsv"
  tpm:
    - - meta:
          type: map
          description: The species' meta map
      - ${meta.id}.tpm.tsv:
          type: file
          description: The TPM, genes by libraries
          pattern: "*.tpm.tsv"
  multiqc:
    - - meta:
          type: map
          description: The species' meta map
      - ${meta.id}.expression_mqc.tsv:
          type: file
          description: Each library's pairs on genes, for MultiQC
          pattern: "*_mqc.tsv"
  log:
    - - meta:
          type: map
          description: The species' meta map
      - "*.log":
          type: file
          description: The command's log
          pattern: "*.log"
  versions_plexembler:
    - - ${task.process}:
          type: string
          description: The process
      - plexembler:
          type: string
          description: The tool
      - "plexembler --version | sed 's/.* //'":
          type: eval
          description: Its version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process
      - plexembler:
          type: string
          description: The tool
      - "plexembler --version | sed 's/.* //'":
          type: eval
          description: Its version
authors:
  - "@js2264"
maintainers:
  - "@js2264"
