name: "plexembler_finalize"
description: Names a species' scaffolds - its chromosomes by size, its organelle, the unplaced - and writes its genome, sizes, names and AGP, once the joins its Hi-C pairs do not support are cut
keywords:
  - genome
  - pool
  - plexembler
tools:
  - "plexembler":
      description: "The commands of plexembler's pipeline"
      homepage: "https://github.com/js2264/plexembler"
      documentation: "https://js2264.github.io/plexembler/cli/#finalize"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: The species' meta map; meta.n_chromosomes, when known
    - fasta:
        type: file
        description: The scaffolds
        pattern: "*.{fa,fasta}{,.gz}"
    - agp:
        type: file
        description: The scaffolder's AGP, or []
        pattern: "*.agp"
    - joins:
        type: file
        description: The scaffolder's joins scored by plexembler junctions --contigs, or []; those unsupported are cut
        pattern: "*.junctions.tsv"
output:
  fasta:
    - - meta:
          type: map
          description: The species' meta map
      - ${meta.id}.fa.gz:
          type: file
          description: The genome, bgzipped
          pattern: "*.fa.gz"
  fai:
    - - meta:
          type: map
          description: The species' meta map
      - ${meta.id}.fa.gz.fai:
          type: file
          description: Its index
          pattern: "*.fai"
  gzi:
    - - meta:
          type: map
          description: The species' meta map
      - ${meta.id}.fa.gz.gzi:
          type: file
          description: Its bgzip index
          pattern: "*.gzi"
  sizes:
    - - meta:
          type: map
          description: The species' meta map
      - ${meta.id}.chrom.sizes:
          type: file
          description: Its chromosome sizes
          pattern: "*.chrom.sizes"
  names:
    - - meta:
          type: map
          description: The species' meta map
      - ${meta.id}.names.tsv:
          type: file
          description: Each scaffold's new name, old name, length and role
          pattern: "*.names.tsv"
  agp:
    - - meta:
          type: map
          description: The species' meta map
      - ${meta.id}.agp:
          type: file
          description: The AGP, the new names
          pattern: "*.agp"
  log:
    - - meta:
          type: map
          description: The species' meta map
      - "*.log":
          type: file
          description: The command's log
          pattern: "*.log"
  versions_plexembler:
    - - ${task.process}:
          type: string
          description: The process
      - plexembler:
          type: string
          description: The tool
      - "plexembler --version | sed 's/.* //'":
          type: eval
          description: Its version
  versions_samtools:
    - - ${task.process}:
          type: string
          description: The process
      - samtools:
          type: string
          description: The tool
      - "samtools version | sed '1!d;s/.* //'":
          type: eval
          description: Its version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process
      - plexembler:
          type: string
          description: The tool
      - "plexembler --version | sed 's/.* //'":
          type: eval
          description: Its version
    - - ${task.process}:
          type: string
          description: The process
      - samtools:
          type: string
          description: The tool
      - "samtools version | sed '1!d;s/.* //'":
          type: eval
          description: Its version
authors:
  - "@js2264"
maintainers:
  - "@js2264"
