# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "plexembler_report"
description: Writes a species' report - its text, MultiQC row and page - from the files the pipeline wrote for it
keywords:
  - report
  - multiqc
  - genome
tools:
  - "plexembler":
      description: "The companion package of js2264/plexembler"
      homepage: "https://js2264.github.io/plexembler/"
      documentation: "https://js2264.github.io/plexembler/cli/#report"
      tool_dev_url: "https://github.com/js2264/plexembler"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: The species' meta map (meta.id, meta.pool)
    - files:
        type: file
        description: The files the pipeline wrote for the species and its pool, each known by its name
        pattern: "*"
output:
  txt:
    - - meta:
          type: map
          description: The species' meta map
      - ${meta.id}.report.txt:
          type: file
          description: Every number of the report
          pattern: "*.report.txt"
  html:
    - - meta:
          type: map
          description: The species' meta map
      - ${meta.id}.report.html:
          type: file
          description: The report's page
          pattern: "*.report.html"
  multiqc:
    - - meta:
          type: map
          description: The species' meta map
      - ${meta.id}.report_mqc.yaml:
          type: file
          description: The species' row of MultiQC's General Statistics
          pattern: "*_mqc.yaml"
  log:
    - - meta:
          type: map
          description: The species' meta map
      - "*.log":
          type: file
          description: The command's log
          pattern: "*.log"
  versions_plexembler:
    - - ${task.process}:
          type: string
          description: The process
      - plexembler:
          type: string
          description: The tool
      - "plexembler --version | sed 's/.* //'":
          type: eval
          description: Its version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process
      - plexembler:
          type: string
          description: The tool
      - "plexembler --version | sed 's/.* //'":
          type: eval
          description: Its version
authors:
  - "@js2264"
maintainers:
  - "@js2264"
