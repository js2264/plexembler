---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# plexembler's own commands, from the release's tag (docs/plan.md, T1). The
# containers run ghcr.io/js2264/plexembler:<version>, which holds the same.
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.13
  - conda-forge::pip=25.3
  # plexembler's dependencies, from conda-forge: pip then adds plexembler alone,
  # whatever ~/.local holds, which the steps do not see (PYTHONNOUSERSITE).
  - conda-forge::click=8.5.1
  - conda-forge::jinja2=3.1.6
  - conda-forge::pyyaml=6.0.3
  - conda-forge::rich-click=1.9.9
  - pip:
      - "plexembler @ git+https://github.com/js2264/plexembler@v0.0.0"
