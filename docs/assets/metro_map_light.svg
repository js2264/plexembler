<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" width="1500" height="940" role="img" aria-labelledby="title desc">
<title id="title">plexembler's metro map</title>
<desc id="desc">Each species' nanopore reads are assembled into its contigs; the pooled WGS, Hi-C and RNA-seq libraries are split between the species, and polish, scaffold, map and annotate each genome; plexembler reports each species.</desc>
<defs>
<filter id="lift" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1540" height="980" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
<feOffset dy="1.5" result="offset"/>
<feFlood flood-color="#0F172A" flood-opacity="0.22"/>
<feComposite in2="offset" operator="in"/>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="lift-small" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1540" height="980" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="1.0"/>
<feOffset dy="1.0" result="offset"/>
<feFlood flood-color="#0F172A" flood-opacity="0.22"/>
<feComposite in2="offset" operator="in"/>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="card-lift" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1540" height="980" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="5.0"/>
<feOffset dy="2.0" result="offset"/>
<feFlood flood-color="#0F172A" flood-opacity="0.07"/>
<feComposite in2="offset" operator="in"/>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="station-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6EBF1"/></linearGradient>
<linearGradient id="card-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F5F8"/></linearGradient>
<linearGradient id="chip-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#1E293B"/></linearGradient>
</defs>
<style>
text { font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0F172A; }
.label { font-size: 17px; font-weight: 500; text-anchor: middle; }
.own { font-weight: 750; }
.muted { fill: #64748B; }
.caption { font-size: 13.5px; font-weight: 500; text-anchor: middle; fill: #64748B; }
.icon { font-size: 10.5px; font-weight: 750; text-anchor: middle; fill: #FFFFFF; letter-spacing: 0.4px; }
.station { fill: url(#station-fill); stroke: #1E293B; stroke-width: 3.2; }
.card { fill: url(#card-fill); stroke: #DDE3EA; stroke-width: 1.2; }
.chip { fill: url(#chip-fill); }
.chip-number { font-size: 13.5px; font-weight: 750; text-anchor: middle; fill: #FFFFFF; }
.section-title { font-size: 15.5px; font-weight: 700; }
.legend-text { font-size: 14px; font-weight: 500; }
.lane, .lane-edge { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.lane { stroke-width: 10; }
.lane-edge { stroke-width: 12.8; }
</style>
