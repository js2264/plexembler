# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "reads_qc"
description: The reads as they come, NanoPlot for the nanopore reads of each species and FastQC for each pooled library
keywords:
  - qc
  - nanopore
  - pooled libraries
components:
  - nanoplot
  - fastqc
input:
  - ch_species:
      type: file
      description: |
        The species, one item per species, its nanopore runs together
        Structure: [ val(meta), [ path(ont) ] ]
      pattern: "*.{fastq,fq}{,.gz}"
  - ch_libraries:
      type: file
      description: |
        The pooled libraries, one item per library, its runs' pairs together
        Structure: [ val(meta), [ path(fastq) ] ]
      pattern: "*.{fastq,fq}.gz"
output:
  - nanoplot:
      type: file
      description: |
        NanoPlot's statistics, one item per species
        Structure: [ val(meta), path(txt) ]
      pattern: "*.txt"
  - fastqc_zip:
      type: file
      description: |
        FastQC's archives, one item per library
        Structure: [ val(meta), [ path(zip) ] ]
      pattern: "*_fastqc.zip"
  - multiqc_files:
      type: file
      description: |
        The files MultiQC reads
        Structure: [ path(file) ]
authors:
  - "@js2264"
maintainers:
  - "@js2264"
